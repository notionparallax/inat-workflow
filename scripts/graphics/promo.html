<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  body {
    width: {{W}}px; height: {{H}}px; overflow: hidden; position: relative;
    background: linear-gradient(170deg, #0d6f9b 0%, #0a4c6e 55%, #062f45 100%);
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: calc({{H}}px * 0.09);
  }
  /* faint light rays from the surface */
  body::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0.05) 0 6%, transparent 6% 14%);
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 75%);
            mask-image: linear-gradient(to bottom, #000, transparent 75%);
  }
  .mark { position: relative; width: calc({{H}}px * 0.46); height: calc({{H}}px * 0.46);
          filter: drop-shadow(0 calc({{H}}px * 0.015) calc({{H}}px * 0.04) rgba(0,0,0,0.35)); }
  .mark svg { display: block; width: 100%; height: 100%; }
  .text { position: relative; }
  h1 { margin: 0; font-weight: 700; letter-spacing: -0.01em; line-height: 1;
       font-size: calc({{H}}px * {{TITLE}}); }
  p { margin: calc({{H}}px * 0.045) 0 0; font-weight: 400; line-height: 1.2; color: #cfe6f3;
      font-size: calc({{H}}px * {{TAG}}); }
  .arrow { color: #ffcf3f; font-weight: 600; }
</style></head>
<body>
  <div class="mark">{{MARK}}</div>
  <div class="text">
    <h1>Dive iNat</h1>
    <p>Dive videos <span class="arrow">&rarr;</span><br>iNaturalist observations</p>
  </div>
</body></html>
